name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run rehearsal:release-flow
      - run: npm run build
      - run: npm run check:browser-build
      - run: npm run build:durable
      - run: npm run check:browser-build:durable
      - name: Check committed browser assets
        run: git diff --exit-code -- assets/browser
      - run: npx playwright install --with-deps chromium
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
      - run: npm run test:browser
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
      - name: Browser checks through Durable Objects
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        env:
          AFTERME_TEST_RUNTIME: durable-object
        run: npm run test:browser
      - run: npm run release:check -- --tracked

  candidate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Scan public Git history
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          cd "$RUNNER_TEMP"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts="--all"
      - run: npm audit --audit-level=moderate
      - run: npm run release:prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-candidate
          path: |
            output/releases/**/afterme-*-source.zip
            output/releases/**/manifest.json
            output/releases/**/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
